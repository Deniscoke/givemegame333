  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    .perk-req-list { display: flex; flex-direction: column; gap: 10px; }
    .perk-req-row {
      display: flex; gap: 12px; align-items: center;
      padding: 12px; background: #0f0f24;
      border: 2px solid #000; border-radius: 4px;
      box-shadow: 3px 3px 0 #000;
    }
    .perk-req-icon { font-size: 28px; width: 48px; text-align: center; flex-shrink: 0; }
    .perk-req-body { flex: 1; min-width: 0; }
    .perk-req-title { font-family: 'Press Start 2P', monospace; font-size: 11px; color: #e9d5ff; margin-bottom: 4px; }
    .perk-req-meta { font-family: 'VT323', monospace; font-size: 16px; color: #94a3b8; }
    .perk-req-desc { font-family: 'VT323', monospace; font-size: 16px; color: #cbd5e1; margin-top: 4px; }
    .perk-req-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-approve {
      padding: 8px 14px; background: #064e3b; color: #6ee7b7;
      border: 2px solid #000; font-family: 'VT323', monospace; font-size: 18px;
      cursor: pointer; box-shadow: 2px 2px 0 #000;
    }
    .btn-approve:hover { background: #047857; color: #fff; }
    .btn-reject {
      padding: 8px 14px; background: #450a0a; color: #fecaca;
      border: 2px solid #000; font-family: 'VT323', monospace; font-size: 18px;
      cursor: pointer; box-shadow: 2px 2px 0 #000;
    }
    .btn-reject:hover { background: #7f1d1d; color: #fff; }
    .empty-state { text-align: center; padding: 40px; color: #64748b; font-family: 'VT323', monospace; font-size: 22px; }
    .empty-state-icon { font-size: 40px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div class="edu-main">
    <header class="edu-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="edu-menu-toggle" onclick="EduApp.toggleSidebar()">&#9776;</button>
        <h2>Ziadosti o odmeny</h2>
      </div>
      <div id="edu-topbar-user" class="edu-topbar-user"></div>
    </header>

    <main class="edu-content">
      <div id="alerts"></div>
      <div class="edu-card">
        <div class="edu-card-header">
          <h3>Cakajuce ziadosti</h3>
          <button class="edu-btn edu-btn-secondary" onclick="EduPerks.load()">Obnovit</button>
        </div>
        <p style="font-family:'VT323',monospace;font-size:18px;color:#94a3b8;margin-bottom:12px">
          Ziaci odomknu odmeny postupom urovni. Schvalis ich pouzitie v realnom case.
        </p>

      </div>
    </main>
  </div>
