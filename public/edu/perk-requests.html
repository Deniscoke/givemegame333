<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gIVEMEEDU — Ziadosti o odmeny</title>
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="/ui/shell.css">
  <link rel="stylesheet" href="/edu/css/edu.css?v=3">
  <style>
    .perk-req-list { display: flex; flex-direction: column; gap: 10px; }
    .perk-req-row {
      display: flex; gap: 12px; align-items: center;
      padding: 12px; background: #0f0f24;
      border: 2px solid #000; border-radius: 4px;
      box-shadow: 3px 3px 0 #000;
    }
    .perk-req-icon { font-size: 28px; width: 48px; text-align: center; flex-shrink: 0; }
    .perk-req-body { flex: 1; min-width: 0; }
    .perk-req-title { font-family: 'Press Start 2P', monospace; font-size: 11px; color: #e9d5ff; margin-bottom: 4px; }
    .perk-req-level { font-family: var(--edu-font-data); font-size: 12px; color: #a855f7; }
    .perk-req-meta { font-family: var(--edu-font-data); font-size: 16px; color: #94a3b8; }
    .perk-req-desc { font-family: var(--edu-font-body); font-size: 16px; color: #cbd5e1; margin-top: 4px; }
    .perk-req-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-approve {
      padding: 8px 14px; background: #064e3b; color: #6ee7b7;
      border: 2px solid #000; font-family: var(--edu-font-body); font-size: 18px;
      cursor: pointer; box-shadow: 2px 2px 0 #000;
    }
    .btn-approve:hover { background: #047857; color: #fff; }
    .btn-reject {
      padding: 8px 14px; background: #450a0a; color: #fecaca;
      border: 2px solid #000; font-family: var(--edu-font-body); font-size: 18px;
      cursor: pointer; box-shadow: 2px 2px 0 #000;
    }
    .btn-reject:hover { background: #7f1d1d; color: #fff; }
    .empty-state { text-align: center; padding: 40px; color: #64748b; font-family: var(--edu-font-body); font-size: 22px; }
    .empty-state-icon { font-size: 40px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <a class="product-skip-link skip-link" href="#main-content">Preskočiť na obsah</a>
  <div data-edu-shell></div>

  <div class="edu-main">
    <header class="edu-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <h1>Ziadosti o odmeny</h1>
      </div>
      <div id="edu-topbar-user" class="edu-topbar-user"></div>
    </header>

    <main class="edu-content" id="main-content">
      <div id="alerts"></div>
      <div class="edu-card">
        <div class="edu-card-header">
          <h3>Cakajuce ziadosti</h3>
          <button class="edu-btn edu-btn-secondary" onclick="EduPerks.load()">Obnovit</button>
        </div>
        <p style="font-size:18px;color:#94a3b8;margin-bottom:12px">
          Ziaci odomknu odmeny postupom urovni. Schvalis ich pouzitie v realnom case.
        </p>
        <div id="perk-req-list"><div class="edu-loading"><div class="edu-spinner"></div></div></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/edu/js/edu-auth.js"></script>
  <script src="/edu/js/edu-shell.js"></script>
  <script src="/edu/js/edu-app.js"></script>
  <script src="/edu/js/edu-perks.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const profile = await EduApp.init();
      EduShell.mount({ root: document.querySelector('[data-edu-shell]'), role: profile?.school?.role, pathname: window.location.pathname });
      await EduPerks.init();
    });
  </script>
</body>
</html>
