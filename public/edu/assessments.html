<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVOK Assessments — gIVEMEGAME.IO</title>
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/edu/css/edu.css?v=3">
<style>
	/* Local styles only — keep visual continuity with /edu/. */
	.assess-shell { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
	.assess-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
	.assess-header h1 { font-size: 28px; margin: 0; }
	.assess-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
	.assess-tab { padding: 10px 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; cursor: pointer; color: inherit; font-size: 14px; min-height: 44px; }
	.assess-tab[aria-selected="true"] { background: var(--accent, #633cff); color: #fff; }
	.assess-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
	.assess-card h3 { margin: 0 0 6px 0; font-size: 18px; }
	.assess-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; opacity: 0.75; }
	.assess-pill { background: rgba(99,60,255,0.18); border: 1px solid rgba(99,60,255,0.4); padding: 2px 8px; border-radius: 999px; }
	.assess-pill.pre { background: rgba(34,197,94,0.18); border-color: rgba(34,197,94,0.4); }
	.assess-pill.post { background: rgba(249,115,22,0.18); border-color: rgba(249,115,22,0.4); }
	.assess-btn { padding: 10px 16px; background: var(--accent, #633cff); color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-size: 14px; min-height: 44px; }
	.assess-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
	.assess-btn.secondary { background: rgba(255,255,255,0.12); }
	.assess-form { display: grid; gap: 12px; }
	.assess-form label { display: block; font-size: 13px; margin-bottom: 4px; opacity: 0.8; }
	.assess-form input[type="text"],
	.assess-form textarea,
	.assess-form select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.25); color: inherit; font: inherit; box-sizing: border-box; }
	.assess-form textarea { min-height: 60px; resize: vertical; }
	.question-block { background: rgba(0,0,0,0.18); border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 8px; }
	.question-options-list { display: grid; gap: 6px; margin-top: 8px; }
	.scale-options { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
	.scale-options label { cursor: pointer; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
	.scale-options input { margin-right: 6px; }
	.delta-card { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.3); padding: 12px; border-radius: 8px; margin-bottom: 8px; }
	.delta-card.regression { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.3); }
	.assess-empty { text-align: center; opacity: 0.5; padding: 24px; }
	.assess-error { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.4); color: #fca5a5; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
	.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
	/* Focus visible for keyboard navigation (WCAG 2.4.7) */
	.assess-tab:focus-visible, .assess-btn:focus-visible, .scale-options label:focus-within {
		outline: 3px solid #fbbf24; outline-offset: 2px;
	}
</style>
</head>
<body>
<a class="product-skip-link skip-link" href="#main-content">Preskočiť na obsah</a>
<div data-edu-shell data-edu-shell-autoload></div>
<div class="edu-main">
<main class="assess-shell" id="main-content">
	<header class="assess-header">
		<h1 data-i18n="assess_title">INVOK Assessmenty</h1>
		<a href="index.html" class="assess-btn secondary" data-i18n="assess_back_to_edu">← Späť do EDU</a>
	</header>

	<nav class="assess-tabs" role="tablist" aria-label="Sections">
		<button class="assess-tab" role="tab" aria-selected="true" data-tab="list" id="tab-list" data-i18n="assess_tab_list">Zoznam</button>
		<button class="assess-tab" role="tab" aria-selected="false" data-tab="create" id="tab-create" data-i18n="assess_tab_create">Vytvoriť</button>
		<button class="assess-tab" role="tab" aria-selected="false" data-tab="results" id="tab-results" data-i18n="assess_tab_results">Moje výsledky</button>
		<button class="assess-tab" role="tab" aria-selected="false" data-tab="summary" id="tab-summary" data-i18n="assess_tab_summary">Súhrn (učiteľ)</button>
	</nav>

	<div id="assess-error" class="assess-error" hidden role="alert" aria-live="polite"></div>

	<section id="panel-list" role="tabpanel" aria-labelledby="tab-list">
		<div id="assess-list-container">
			<p class="assess-empty" data-i18n="assess_loading">Načítavam...</p>
		</div>
	</section>

	<section id="panel-create" role="tabpanel" aria-labelledby="tab-create" hidden>
		<h2 data-i18n="assess_create_h2">Vytvoriť nový assessment</h2>
		<form id="create-form" class="assess-form" novalidate>
			<div>
				<label for="cf-title" data-i18n="assess_label_title">Názov</label>
				<input id="cf-title" type="text" required maxlength="200" autocomplete="off">
			</div>
			<div>
				<label for="cf-description" data-i18n="assess_label_description">Popis</label>
				<textarea id="cf-description" maxlength="2000"></textarea>
			</div>
			<div>
				<label for="cf-module" data-i18n="assess_label_module">INVOK modul</label>
				<select id="cf-module" required>
					<option value="entrepreneurship" data-i18n="assess_module_entrepreneurship">Podnikavosť a inovácie</option>
					<option value="critical_media_thinking" data-i18n="assess_module_critical_media_thinking">Kritické a mediálne myslenie</option>
					<option value="teamwork_digital_tools" data-i18n="assess_module_teamwork_digital_tools">Tímová spolupráca a digitálne nástroje</option>
					<option value="presentation_communication" data-i18n="assess_module_presentation_communication">Prezentačné a komunikačné zručnosti</option>
				</select>
			</div>
			<div>
				<label for="cf-type" data-i18n="assess_label_type">Typ testu</label>
				<select id="cf-type" required>
					<option value="pre" data-i18n="assess_type_pre">Pre-test (vstupné meranie)</option>
					<option value="post" data-i18n="assess_type_post">Post-test (výstupné meranie)</option>
					<option value="generic" data-i18n="assess_type_generic">Generic</option>
				</select>
			</div>

			<fieldset>
				<legend data-i18n="assess_label_questions">Otázky</legend>
				<div id="cf-questions"></div>
				<button type="button" id="btn-add-question" class="assess-btn secondary" data-i18n="assess_add_question">+ Pridať otázku</button>
			</fieldset>

			<div>
				<button type="submit" class="assess-btn" data-i18n="assess_btn_save">Uložiť assessment</button>
			</div>
		</form>
	</section>

	<section id="panel-results" role="tabpanel" aria-labelledby="tab-results" hidden>
		<div id="results-container">
			<p class="assess-empty" data-i18n="assess_loading">Načítavam...</p>
		</div>
	</section>

	<section id="panel-summary" role="tabpanel" aria-labelledby="tab-summary" hidden>
		<div id="summary-container">
			<p class="assess-empty" data-i18n="assess_loading">Načítavam...</p>
		</div>
	</section>

	<section id="panel-take" role="tabpanel" hidden aria-label="Take assessment">
		<div id="take-container"></div>
	</section>
</main>
</div>

<!-- Supabase client + auth (same approach as the rest of /edu/) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/edu/js/edu-auth.js"></script>
<script src="/edu/js/edu-shell.js"></script>
<script src="/edu/js/assessments.js?v=1"></script>
</body>
</html>
