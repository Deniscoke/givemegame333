<!DOCTYPE html>
<html lang="sk">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23633cff'/><text x='16' y='22' font-size='14' fill='white' text-anchor='middle' font-family='sans-serif'>G</text></svg>">
	<title>gIVEMEGAME.IO — Prihlásenie</title>
	<link rel="stylesheet" href="/ui/tokens.css">
	<link rel="stylesheet" href="/ui/shell.css">
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: var(--font-body);
			font-size: 16px;
			line-height: 1.55;
			background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
			color: #fff;
			overflow-x: hidden;
			overflow-y: auto;
			padding: 24px 0;
		}

		/* Animated background grid */
		body::before {
			content: '';
			position: fixed;
			top: 0; left: 0; right: 0; bottom: 0;
			background-image:
				linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
				linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
			background-size: 40px 40px;
			animation: grid-scroll 20s linear infinite;
			z-index: 0;
		}
		@keyframes grid-scroll {
			0% { transform: translate(0, 0); }
			100% { transform: translate(40px, 40px); }
		}

		.login-card {
			position: relative;
			z-index: 1;
			background: rgba(15, 12, 41, 0.85);
			border: 2px solid rgba(255, 255, 255, 0.1);
			border-radius: 16px;
			padding: 32px 24px;
			max-width: 420px;
			width: 90%;
			text-align: center;
			box-shadow:
				0 0 40px rgba(131, 56, 236, 0.2),
				0 0 80px rgba(58, 134, 255, 0.1);
			backdrop-filter: blur(10px);
			margin: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
		}
		@media (min-width: 480px) {
			.login-card { padding: 48px 40px; }
		}

		.brand {
			font-family: 'Press Start 2P', monospace;
			font-size: 20px;
			margin-bottom: 8px;
			line-height: 1.4;
		}
		.brand-give { color: #ff006e; }
		.brand-me { color: #ffbe0b; }
		.brand-game { color: #3a86ff; }
		.brand-io { color: #8338ec; }

		.tagline {
			font-size: 18px;
			color: rgba(255,255,255,0.5);
			margin-bottom: 32px;
		}

		.btn-login {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
			width: 100%;
			min-height: 48px;
			padding: 14px 24px;
			border: 2px solid rgba(255,255,255,0.2);
			border-radius: 10px;
			background: rgba(255,255,255,0.05);
			color: #fff;
			font-family: var(--font-body);
			font-size: 18px;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.2s;
			margin-bottom: 12px;
			-webkit-tap-highlight-color: transparent;
			touch-action: manipulation;
		}
		.btn-login:hover {
			background: rgba(255,255,255,0.12);
			border-color: rgba(255,255,255,0.4);
			transform: translateY(-2px);
			box-shadow: 0 4px 20px rgba(131, 56, 236, 0.3);
		}
		.btn-login:active {
			transform: translateY(0);
		}

		.btn-google {
			border-color: rgba(66, 133, 244, 0.4);
		}
		.btn-google:hover {
			border-color: #4285f4;
			box-shadow: 0 4px 20px rgba(66, 133, 244, 0.3);
		}

		.google-icon {
			width: 22px;
			height: 22px;
		}

		.login-footer {
			margin-top: 24px;
			font-size: 14px;
			color: rgba(255,255,255,0.3);
		}
		.login-footer a {
			color: #8338ec;
			text-decoration: none;
		}

		.error-msg {
			color: #ef4444;
			font-size: 14px;
			margin-top: 12px;
			display: none;
		}

		.login-lang-row {
			display: flex;
			justify-content: center;
			gap: 6px;
			margin-bottom: 20px;
			flex-wrap: wrap;
		}
		.login-lang-btn {
			min-height: 44px;
			font-family: var(--font-body);
			font-size: 14px;
			font-weight: 700;
			padding: 8px 12px;
			background: rgba(255,255,255,0.06);
			color: rgba(255,255,255,0.9);
			border: 2px solid rgba(255,255,255,0.2);
			border-radius: 6px;
			cursor: pointer;
			transition: all 0.2s;
			text-transform: uppercase;
		}
		.login-lang-btn:hover {
			background: rgba(255,255,255,0.12);
			border-color: rgba(255,255,255,0.4);
		}
		.login-lang-btn.active {
			background: rgba(131, 56, 236, 0.4);
			border-color: #8338ec;
			color: #fff;
		}

		.btn-skip {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 44px;
			margin-top: 16px;
			padding: 10px 16px;
			font-size: 14px;
			color: rgba(255,255,255,0.6);
			text-decoration: none;
			border: 1px solid rgba(255,255,255,0.2);
			border-radius: 8px;
			transition: all 0.2s;
			-webkit-tap-highlight-color: transparent;
		}
		.login-footer .footer-brand {
			font-family: var(--font-pixel);
			font-size: 10px;
		}
		.btn-skip--highlight {
			color: #fff;
			border-color: #06d6a0;
			box-shadow: 0 0 0 2px rgba(6, 214, 160, 0.35);
			animation: skip-pulse 1.6s ease-in-out 3;
		}
		@keyframes skip-pulse {
			0%, 100% { box-shadow: 0 0 0 2px rgba(6, 214, 160, 0.35); }
			50% { box-shadow: 0 0 0 6px rgba(6, 214, 160, 0.15); }
		}
		@media (prefers-reduced-motion: reduce) {
			.btn-skip--highlight { animation: none; }
		}
		.btn-skip:hover, .btn-skip:active {
			color: rgba(255,255,255,0.9);
			border-color: rgba(255,255,255,0.4);
		}

		/* Loading state */
		.btn-login.loading {
			pointer-events: none;
			opacity: 0.6;
		}

		/* Floating particles */
		.particle {
			position: fixed;
			border-radius: 50%;
			pointer-events: none;
			z-index: 0;
			animation: float-up linear infinite;
		}
		@keyframes float-up {
			0% { transform: translateY(100vh) scale(0); opacity: 0; }
			20% { opacity: 0.6; }
			80% { opacity: 0.3; }
			100% { transform: translateY(-10vh) scale(1); opacity: 0; }
		}
	</style>
</head>
<body>

	<div class="login-card">
		<div class="brand">
			<span class="brand-give">gIVE</span><span class="brand-me">ME</span><span class="brand-game">GAME</span><span class="brand-io">.IO</span>
		</div>
		<h1 class="tagline">Generátor vzdelávacích hier</h1>

		<!-- Language selector — viditeľný hneď na logine -->
		<div class="login-lang-row">
			<button type="button" class="login-lang-btn" data-lang="sk" title="Slovenčina">SK</button>
			<button type="button" class="login-lang-btn" data-lang="cs" title="Čeština">CZ</button>
			<button type="button" class="login-lang-btn" data-lang="de" title="Deutsch">DE</button>
			<button type="button" class="login-lang-btn" data-lang="en" title="English">EN</button>
			<button type="button" class="login-lang-btn" data-lang="es" title="Español">ES</button>
			<button type="button" class="login-lang-btn" data-lang="tr" title="Türkçe">TR</button>
		</div>

		<button class="btn-login btn-google" id="btn-google" type="button">
			<svg class="google-icon" viewBox="0 0 24 24">
				<path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
				<path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
				<path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
				<path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
			</svg>
			Prihlásiť sa cez Google
		</button>

		<div class="error-msg" id="error-msg"></div>

		<a href="/index.html" class="btn-skip" id="btn-skip">Hrať bez prihlásenia</a>

		<div class="login-footer">
			<span class="brand-give footer-brand">IW</span>
			&copy; 2026 IndiWeb
		</div>
	</div>

	<!-- Floating particles -->
	<script>
		for (let i = 0; i < 20; i++) {
			const p = document.createElement('div');
			p.className = 'particle';
			const size = 2 + Math.random() * 4;
			const colors = ['#ff006e', '#ffbe0b', '#3a86ff', '#8338ec', '#06d6a0'];
			p.style.cssText = `
				width: ${size}px; height: ${size}px;
				left: ${Math.random() * 100}%;
				background: ${colors[Math.floor(Math.random() * colors.length)]};
				animation-duration: ${8 + Math.random() * 12}s;
				animation-delay: ${Math.random() * 10}s;
			`;
			document.body.appendChild(p);
		}
	</script>

	<!-- Lang selector: uloží výber, index.html ho načíta -->
	<script>
	(function() {
		const KEY = 'givemegame_preferred_lang';
		// BEGIN resolveInitialLang (čistá funkcia — rovnaká kópia je v script.js, testuje test/frontend-ux.test.js)
		function resolveInitialLang(saved, browserLangs) {
			const SUPPORTED = ['sk', 'cs', 'en', 'de', 'es', 'tr'];
			const norm = (v) => String(v || '').trim().toLowerCase().split(/[-_]/)[0];
			if (SUPPORTED.includes(norm(saved))) return norm(saved);
			const list = Array.isArray(browserLangs) ? browserLangs : [browserLangs];
			for (const l of list) {
				if (SUPPORTED.includes(norm(l))) return norm(l);
			}
			return 'sk';
		}
		// END resolveInitialLang
		let storedLang = null;
		try { storedLang = localStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
		let currentLang = resolveInitialLang(
			storedLang,
			(navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language]
		);

		// Malý prekladač pre login stránku (index.html má vlastný v script.js)
		let strings = null;
		function loadStrings(lang) {
			return fetch('/data/i18n/' + encodeURIComponent(lang) + '.json')
				.then(r => (r.ok ? r.json() : null))
				.then(d => { if (lang === currentLang) strings = d; return d; })
				.catch(() => null);
		}
		window.givemegame_loginT = function(key, fallback) {
			return (strings && typeof strings[key] === 'string') ? strings[key] : (fallback || key);
		};
		// Preložené texty, ktoré už sú zobrazené (napr. hláška o výpadku prihlásenia), obnov po zmene jazyka
		function refreshVisible() {
			document.querySelectorAll('[data-login-i18n]').forEach(el => {
				el.textContent = window.givemegame_loginT(el.getAttribute('data-login-i18n'), el.textContent);
			});
		}
		function applyLang(lang) {
			currentLang = lang;
			document.documentElement.lang = lang;
			document.querySelectorAll('.login-lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
			loadStrings(lang).then(refreshVisible);
		}

		applyLang(currentLang);
		document.querySelectorAll('.login-lang-btn').forEach(btn => {
			btn.addEventListener('click', function() {
				const lang = this.dataset.lang;
				try { localStorage.setItem(KEY, lang); } catch (e) { /* storage blocked */ }
				applyLang(lang);
			});
		});
	})();
	</script>

	<!-- Supabase Auth SDK -->
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
	<script src="/js/post-login-router.js"></script>
	<script>
	(function() {
		'use strict';

		const SUPABASE_URL = 'https://vhpkkbixshfyytohkruv.supabase.co';
		const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZocGtrYml4c2hmeXl0b2hrcnV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMDAzNzcsImV4cCI6MjA4ODY3NjM3N30.umrrhSqC9LW2Wlcs5y4uCViVfZmqyHcMbaPQaQiMbR0';

		let supabase = null;
		try {
			if (window.supabase) {
				supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
					auth: { detectSessionInUrl: true, persistSession: true }
				});
			}
		} catch (e) {
			console.error('[Login] Supabase init failed:', e);
		}

		const loginT = (key, fallback) => (window.givemegame_loginT ? window.givemegame_loginT(key, fallback) : fallback);

		function showError(msg) {
			const el = document.getElementById('error-msg');
			if (el) { el.removeAttribute('data-login-i18n'); el.textContent = msg; el.style.display = 'block'; }
		}

		// Preložená chyba — data-login-i18n zabezpečí prepnutie pri zmene jazyka
		function showErrorKey(key, fallback) {
			const el = document.getElementById('error-msg');
			if (!el) return;
			el.textContent = loginT(key, fallback);
			el.setAttribute('data-login-i18n', key);
			el.style.display = 'block';
		}

		function highlightGuestOption() {
			const skip = document.getElementById('btn-skip');
			if (!skip) return;
			skip.classList.add('btn-skip--highlight');
			try { skip.focus({ preventScroll: true }); } catch (e) { skip.focus(); }
		}

		// Overí, či je Supabase Auth dosiahnuteľný, skôr než pošleme používateľa na Google.
		// Nedosiahnuteľný = sieťová chyba, timeout (4 s) alebo 5xx. 4xx berieme ako "server žije".
		const AUTH_HEALTH_TIMEOUT_MS = 4000;
		async function isAuthReachable() {
			const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
			const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, AUTH_HEALTH_TIMEOUT_MS);
			try {
				const res = await fetch(SUPABASE_URL + '/auth/v1/health', {
					method: 'GET',
					headers: { apikey: SUPABASE_ANON_KEY },
					cache: 'no-store',
					signal: ctrl ? ctrl.signal : undefined
				});
				return res.status < 500;
			} catch (e) {
				console.warn('[Login] Auth health check failed:', e && e.name);
				return false;
			} finally {
				clearTimeout(timer);
			}
		}

		function resetGoogleButton() {
			const btn = document.getElementById('btn-google');
			if (!btn) return;
			btn.classList.remove('loading');
			btn.disabled = false;
			btn.innerHTML = '<svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Prihlásiť sa cez Google';
		}

		let redirectPromise = null;

		function saveUserAndRedirect(user) {
			if (!redirectPromise) redirectPromise = persistUserAndRedirect(user);
			return redirectPromise;
		}

		async function persistUserAndRedirect(user) {
			const pendingLobby = sessionStorage.getItem('givemegame_pending_lobby');
			// Ulož profil do Supabase (ak existuje tabuľka profiles)
			if (supabase) {
				const { error } = await supabase.from('profiles').upsert({
					id: user.id,
					display_name: user.user_metadata?.full_name || user.email?.split('@')[0] || 'Player',
					avatar_url: user.user_metadata?.avatar_url || null,
					updated_at: new Date().toISOString()
				}, { onConflict: 'id' });
				if (error) console.warn('[Login] Profile upsert:', error.message);
			}
			sessionStorage.setItem('givemegame_user', JSON.stringify({
				uid: user.id,
				name: user.user_metadata?.full_name || user.email?.split('@')[0] || 'Player',
				email: user.email,
				photo: user.user_metadata?.avatar_url || null
			}));
			// Krátke oneskorenie — Supabase musí uložiť session do localStorage pred redirectom
			await new Promise(r => setTimeout(r, 150));
			const { data: { session } } = await supabase.auth.getSession();
			const schoolRole = await window.PostLoginRouter.fetchSchoolRole(session?.access_token, window.fetch);
			const destination = window.PostLoginRouter.destinationFor({ pendingLobby, schoolRole });
			window.location.href = destination;
			if (pendingLobby) sessionStorage.removeItem('givemegame_pending_lobby');
		}

		function checkOAuthError() {
			const hash = window.location.hash?.slice(1) || '';
			if (!hash) return false;
			const params = new URLSearchParams(hash);
			if (params.get('error_code') || params.get('error_description')) {
				showError(params.get('error_description') || 'Chyba prihlásenia');
				window.history.replaceState(null, '', window.location.pathname + window.location.search);
				return true;
			}
			return false;
		}

		// Google login — vždy definované, reaguje na klik
		async function loginGoogle() {
			const btn = document.getElementById('btn-google');
			const errEl = document.getElementById('error-msg');
			if (btn) { btn.classList.add('loading'); btn.disabled = true; }
			if (errEl) errEl.style.display = 'none';

			if (!supabase) {
				resetGoogleButton();
				showErrorKey('login_sdk_failed', 'Prihlásenie sa nenačítalo. Skontroluj pripojenie alebo vypni blokovanie reklám.');
				highlightGuestOption();
				return;
			}

			const origin = window.location.origin;
			if (!origin || origin === 'null' || origin.startsWith('file:')) {
				console.warn('[Login] Page opened from file:// — OAuth needs the app served over http(s).');
				resetGoogleButton();
				showErrorKey('login_open_via_web', 'Prihlásenie funguje len na webovej adrese aplikácie.');
				return;
			}

			if (!(await isAuthReachable())) {
				resetGoogleButton();
				showErrorKey('login_auth_unavailable', 'Prihlásenie je dočasne nedostupné. Môžeš zatiaľ hrať bez prihlásenia.');
				highlightGuestOption();
				return;
			}

			try {
				// redirectTo musí byť v Supabase Dashboard → Auth → URL Configuration (pridaj svoju URL)
				const { data, error } = await supabase.auth.signInWithOAuth({
					provider: 'google',
					options: { redirectTo: origin + '/login.html' }
				});
				if (error) throw error;
				if (data?.url) {
					window.location.href = data.url;
					return;
				}
				// Pre vývojára: Google provider nie je zapnutý (Supabase Dashboard → Authentication → Providers)
				throw new Error('OAuth provider returned no redirect URL');
			} catch (err) {
				console.error('[Login]', err);
				resetGoogleButton();
				showErrorKey('login_failed', 'Prihlásenie zlyhalo. Skús to znova alebo hraj bez prihlásenia.');
				highlightGuestOption();
			}
		}

		// Event listeners
		document.getElementById('btn-google')?.addEventListener('click', loginGoogle);

		// Inicializácia session
		if (supabase && !checkOAuthError()) {
			supabase.auth.getSession().then(({ data: { session } }) => {
				if (session?.user) saveUserAndRedirect(session.user);
			});
			supabase.auth.onAuthStateChange((event, session) => {
				if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session?.user) {
					saveUserAndRedirect(session.user);
				}
			});
		}
	})();
	</script>

</body>
</html>
