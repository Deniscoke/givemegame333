name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(server.js lib/*.js scripts/*.js public/js/*.js)
          for f in "${files[@]}"; do
            node --check "$f"
          done
          echo "Syntax OK: ${#files[@]} files"

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test -name '*.test.js' | sort)
          node --test "${tests[@]}"
